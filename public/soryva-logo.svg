<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Soryva Weather</title>
  <desc id="desc">A blue weather cloud with a location pin, yellow sun and Soryva Weather wordmark.</desc>
  <defs>
    <linearGradient id="cloud" x1="80" y1="245" x2="330" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.48" stop-color="#1d8cff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sun" x1="82" y1="84" x2="196" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <circle cx="144" cy="125" r="48" fill="url(#sun)"/>
    <g stroke="#fbbf24" stroke-width="10" stroke-linecap="round">
      <path d="M144 45v-22"/>
      <path d="M87 69 72 52"/>
      <path d="M63 126H38"/>
      <path d="M88 182 72 199"/>
      <path d="M201 69 216 52"/>
    </g>

    <path fill="url(#cloud)" d="M90 246c-40 0-72-31-72-70 0-35 25-64 58-69 13-44 54-76 103-76 58 0 106 45 108 102 36 7 63 39 63 76 0 20-16 37-36 37H90Z"/>
    <path fill="#fff" d="M178 122c-43 0-78 35-78 78 0 31 18 58 45 71l33 33 33-33c27-13 45-40 45-71 0-43-35-78-78-78Zm0 105a31 31 0 1 1 0-62 31 31 0 0 1 0 62Z"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="850">
    <text x="415" y="142" fill="#08244b" font-size="112" letter-spacing="-5">Soryva</text>
    <text x="417" y="230" fill="#1d8cff" font-size="82" letter-spacing="-3">Weather</text>
    <text x="420" y="280" fill="#64748b" font-size="34" font-weight="500" letter-spacing="1">for what you actually do.</text>
  </g>
</svg>
